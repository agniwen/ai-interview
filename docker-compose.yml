services:
  web:
    build:
      context: .
      dockerfile: apps/ai-recruitment-copilot/Dockerfile
      args:
        BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required at build time}
        NEXT_PUBLIC_AGENT_NAME: ${NEXT_PUBLIC_AGENT_NAME:-giaogiao}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-${BETTER_AUTH_URL:?BETTER_AUTH_URL is required at build time}}
        NEXT_PUBLIC_BETTER_AUTH_URL: ${NEXT_PUBLIC_BETTER_AUTH_URL:-${BETTER_AUTH_URL:?BETTER_AUTH_URL is required at build time}}
        NEXT_PUBLIC_ENABLE_GOOGLE_LOGIN: ${NEXT_PUBLIC_ENABLE_GOOGLE_LOGIN:-false}
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000/api/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    init: true
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/ai-recruitment-copilot-worker/Dockerfile
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:8790/readyz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    init: true
    restart: unless-stopped

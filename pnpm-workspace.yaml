packages:
  - "apps/*"
  - "packages/*"

catalog:
  "@types/react": 19.2.17
  "@types/react-dom": 19.2.3
  ai: ^6.0.219
  chat: ^4.28.1
  drizzle-kit: 1.0.0-rc.1
  drizzle-orm: 1.0.0-rc.1
  next: 16.1.6
  react: 19.2.7
  react-dom: 19.2.7
  typescript: 7.0.2
  vite: ^8.1.3
  vitest: ^4.1.7
  zod: ^4.4.3

allowBuilds:
  canvas: set this to true or false
  cbor-extract: true
  core-js: false
  electron: true
  electron-winstaller: true
  esbuild: true
  lefthook: true
  msgpackr-extract: false
  msw: false
  protobufjs: true
  sharp: true

ignoredBuiltDependencies:
  - msgpackr-extract
  - msw
  - sharp
  - unrs-resolver
packageExtensions:
  "@mastra/deployer@1.50.1":
    dependencies:
      typescript: 6.0.3
  "streamdown@2.5.0":
    dependencies:
      shiki: ^3.19.0
overrides:
  react: 19.2.7
  react-dom: 19.2.7
peerDependencyRules:
  allowedVersions:
    ai: ^6.0.219
shellEmulator: true

trustPolicy: no-downgrade

# Known false positives — earlier versions had CI-attached SLSA provenance,
# but the current version was republished manually by a trusted maintainer
# without provenance (signing key unchanged). pnpm flags this as a
# downgrade; it is not.
trustPolicyExclude:
  # Version-specific entries (semver@6.3.1 etc.) do not match lockfile verification
  # in pnpm@11.5.2; package-name form is required for electron-builder's transitive
  # semver@5.7.2 / eslint-plugin-react's semver@6.3.1 republish-without-provenance cases.
  - "semver"
  - "reselect@5.1.1"
  - "tinyexec@1.2.2"
  # electron@39 → @types/node@22 → undici-types@6.21.0 (DefinitelyTyped republish)
  - "undici-types@6.21.0"

minimumReleaseAgeExclude:
  - "@extend-ai/react-docx@0.7.1"
  - "@typescript/typescript-aix-ppc64@7.0.2"
  - "@typescript/typescript-darwin-arm64@7.0.2"
  - "@typescript/typescript-darwin-x64@7.0.2"
  - "@typescript/typescript-freebsd-arm64@7.0.2"
  - "@typescript/typescript-freebsd-x64@7.0.2"
  - "@typescript/typescript-linux-arm64@7.0.2"
  - "@typescript/typescript-linux-arm@7.0.2"
  - "@typescript/typescript-linux-loong64@7.0.2"
  - "@typescript/typescript-linux-mips64el@7.0.2"
  - "@typescript/typescript-linux-ppc64@7.0.2"
  - "@typescript/typescript-linux-riscv64@7.0.2"
  - "@typescript/typescript-linux-s390x@7.0.2"
  - "@typescript/typescript-linux-x64@7.0.2"
  - "@typescript/typescript-netbsd-arm64@7.0.2"
  - "@typescript/typescript-netbsd-x64@7.0.2"
  - "@typescript/typescript-openbsd-arm64@7.0.2"
  - "@typescript/typescript-openbsd-x64@7.0.2"
  - "@typescript/typescript-sunos-x64@7.0.2"
  - "@typescript/typescript-win32-arm64@7.0.2"
  - "@typescript/typescript-win32-x64@7.0.2"
  - typescript@7.0.2
  - "@ai-sdk/gateway@3.0.4"
  - "@ai-sdk/mcp@1.0.55"
  - "@ai-sdk/openai-compatible@2.0.56"
  - "@ai-sdk/provider-utils@4.0.35"
  - "@ai-sdk/provider@3.0.13"
  - "@ai-sdk/react@3.0.221"
  - ai@6.0.219
  - "@tanstack/react-table@9.0.0"
  - "@tanstack/table-core@9.0.0"

# Web-only package patch. Worker Docker `pnpm deploy` only installs a subset of
# workspace packages, so this patch is unused there — allow rather than fail CI.
allowUnusedPatches: true
patchedDependencies:
  "@mastra/playground-ui@40.0.1": patches/@mastra__playground-ui@40.0.1.patch

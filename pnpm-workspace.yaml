packages:
  - "apps/*"
  - "packages/*"

catalog:
  "@types/react": ^19.2.14
  "@types/react-dom": ^19.2.3
  ai: ^6.0.219
  chat: ^4.28.1
  drizzle-kit: 1.0.0-rc.1
  drizzle-orm: 1.0.0-rc.1
  next: 16.1.6
  react: 19.2.3
  react-dom: 19.2.3
  typescript: 7.0.1-rc
  vite: ^8.0.14
  vitest: ^4.1.7
  zod: ^4.4.3

allowBuilds:
  canvas: set this to true or false
  cbor-extract: true
  core-js: false
  esbuild: true
  lefthook: true
  msgpackr-extract: false
  protobufjs: true
  sharp: true

ignoredBuiltDependencies:
  - msgpackr-extract
  - msw
  - sharp
  - unrs-resolver
peerDependencyRules:
  allowedVersions:
    ai: ^6.0.219
shellEmulator: true

trustPolicy: no-downgrade

# Known false positives — earlier versions had CI-attached SLSA provenance,
# but the current version was republished manually by a trusted maintainer
# without provenance (signing key unchanged). pnpm flags this as a
# downgrade; it is not.
trustPolicyExclude:
  - "semver@6.3.1"
  # @base-ui/utils@0.2.8 transitively pins reselect: ^5.1.1. 5.1.0 was
  # CI-published with provenance; 5.1.1 was republished by Redux maintainer
  # acemarke (Mark Erikson) from a local machine. Same npm signing key.
  - "reselect@5.1.1"
  # vitest@4.x pulls tinyexec@^1.0.2. 1.2.2 was published with provenance
  # attestation and the same npm registry signing key as earlier 1.x releases;
  # pnpm flags the publisher/provenance evidence change as a downgrade.
  - "tinyexec@1.2.2"

minimumReleaseAgeExclude:
  - "@extend-ai/react-docx@0.7.1"
  - "@typescript/typescript-aix-ppc64@7.0.1-rc"
  - "@typescript/typescript-darwin-arm64@7.0.1-rc"
  - "@typescript/typescript-darwin-x64@7.0.1-rc"
  - "@typescript/typescript-freebsd-arm64@7.0.1-rc"
  - "@typescript/typescript-freebsd-x64@7.0.1-rc"
  - "@typescript/typescript-linux-arm64@7.0.1-rc"
  - "@typescript/typescript-linux-arm@7.0.1-rc"
  - "@typescript/typescript-linux-loong64@7.0.1-rc"
  - "@typescript/typescript-linux-mips64el@7.0.1-rc"
  - "@typescript/typescript-linux-ppc64@7.0.1-rc"
  - "@typescript/typescript-linux-riscv64@7.0.1-rc"
  - "@typescript/typescript-linux-s390x@7.0.1-rc"
  - "@typescript/typescript-linux-x64@7.0.1-rc"
  - "@typescript/typescript-netbsd-arm64@7.0.1-rc"
  - "@typescript/typescript-netbsd-x64@7.0.1-rc"
  - "@typescript/typescript-openbsd-arm64@7.0.1-rc"
  - "@typescript/typescript-openbsd-x64@7.0.1-rc"
  - "@typescript/typescript-sunos-x64@7.0.1-rc"
  - "@typescript/typescript-win32-arm64@7.0.1-rc"
  - "@typescript/typescript-win32-x64@7.0.1-rc"
  - typescript@7.0.1-rc
  - "@ai-sdk/gateway@3.0.4"
  - "@ai-sdk/mcp@1.0.55"
  - "@ai-sdk/openai-compatible@2.0.56"
  - "@ai-sdk/provider-utils@4.0.35"
  - "@ai-sdk/provider@3.0.13"
  - "@ai-sdk/react@3.0.221"
  - ai@6.0.219

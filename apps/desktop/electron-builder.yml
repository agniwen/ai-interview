appId: com.arc.ai-recruitment-copilot-desktop
productName: Echo
directories:
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,bun.lock}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
asarUnpack:
  - resources/**
extraResources:
  - from: drizzle-local
    to: desktop-db-migrations
    filter:
      - "**/migration.sql"
win:
  executableName: echo
  icon: icon.png
nsis:
  artifactName: Echo-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  icon: echo.icon
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSMicrophoneUsageDescription: Echo needs microphone access to record your side of meetings.
    NSAudioCaptureUsageDescription: Echo needs system audio access to record the other side of meetings.
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: true
dmg:
  artifactName: Echo-${version}.${ext}
  icon: icon.icns
linux:
  icon: icons
  target:
    - AppImage
    - deb
  maintainer: arc
  category: Utility
appImage:
  artifactName: Echo-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates

services:
  web:
    build:
      args:
        BETTER_AUTH_URL: http://localhost:3000
        NEXT_PUBLIC_BASE_URL: http://localhost:3000
        NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3000
    env_file:
      - path: apps/ai-recruitment-copilot/.env
        required: true
    healthcheck:
      test:
        - CMD-SHELL
        - bun -e "fetch('http://127.0.0.1:3000/api/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
    ports:
      - "3000:3000"
    restart: "no"

  worker:
    env_file:
      - path: apps/ai-recruitment-copilot/.env
        required: true
    healthcheck:
      test:
        - CMD-SHELL
        - bun -e "fetch('http://127.0.0.1:8790/readyz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
    ports:
      - "8790:8790"
    restart: "no"
